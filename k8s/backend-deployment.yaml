apiVersion: apps/v1
kind: Deployment
metadata:
  name: dementes-backend
  labels:
    app: dementes-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dementes-backend
  template:
    metadata:
      labels:
        app: dementes-backend
    spec:
      containers:
      - name: backend
        image: dementes-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          value: "dementes_admin"
        - name: DB_PASSWORD
          value: "Yj1996dmn!"
        - name: DB_DATABASE
          value: "dementes_db"
        - name: JWT_SECRET
          value: "DementesSecretKey2026_HarryPotter_Wizard_Strong_Key"
        - name: JWT_EXPIRES_IN
          value: "8h"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: dementes-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: LoadBalancer
