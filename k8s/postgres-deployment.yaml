apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dementes
  labels:
    app: postgres-dementes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-dementes
  template:
    metadata:
      labels:
        app: postgres-dementes
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "dementes_db"
        - name: POSTGRES_USER
          value: "dementes_admin"
        - name: POSTGRES_PASSWORD
          value: "Yj1996dmn!"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres-dementes
  ports:
  - port: 5432
    targetPort: 5432
