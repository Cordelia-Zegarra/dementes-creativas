apiVersion: apps/v1
kind: Deployment
metadata:
  name: dementes-frontend
  labels:
    app: dementes-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dementes-frontend
  template:
    metadata:
      labels:
        app: dementes-frontend
    spec:
      containers:
      - name: frontend
        image: dementes-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: dementes-frontend
  ports:
  - port: 80
    targetPort: 5173
  type: LoadBalancer
